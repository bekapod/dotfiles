onboarding = false
[theme]
name = "rose-pine"

[keys]
prefix = "ctrl+space"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "zsh -i -c lazygit"
width = "90%"
height = "90%"

[ui.toast]
delivery = "herdr"

[ui]
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

# ── Herdr Annotate (plannotator) ──────────────────────────────
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# Document review (plannotator-tui)
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"
